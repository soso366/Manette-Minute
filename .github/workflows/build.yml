name: Fabriquer l'appli (APK)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fabriquer l'APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk ManetteMinute.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Manette Minute v1.${{ github.run_number }}
          body: "Fichier à installer sur le Fire TV : ManetteMinute.apk"
          files: ManetteMinute.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: ManetteMinute-apk
          path: ManetteMinute.apk
